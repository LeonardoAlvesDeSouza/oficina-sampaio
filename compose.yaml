services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oficina_sampaio
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina_sampaio"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - oficina-sampaio-postgres-data:/var/lib/postgresql/data

volumes:
  oficina-sampaio-postgres-data:
