<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ordens de serviço · Oficina Sampaio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/navegacao :: principal}"></nav>

<main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h1 class="h3 mb-1">Ordens de serviço</h1>
            <p class="text-body-secondary mb-0">Acompanhe serviços, peças e valores registrados.</p>
        </div>
        <a th:href="@{/clientes}" class="btn btn-primary">Abrir pelo veículo</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Ordem</th>
                    <th>Problema relatado</th>
                    <th>Status</th>
                    <th>Abertura</th>
                    <th class="text-end">Total</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${ordens.isEmpty()}">
                    <td colspan="5" class="text-center text-body-secondary py-4">
                        Nenhuma ordem de serviço aberta.
                    </td>
                </tr>
                <tr th:each="ordem : ${ordens}">
                    <td>
                        <a th:href="@{/ordens-servico/{id}(id=${ordem.id})}"
                           th:text="|#${#strings.substring(ordem.id.toString(), 0, 8)}|"></a>
                    </td>
                    <td th:text="${ordem.relatoProblema}"></td>
                    <td><span class="badge text-bg-primary" th:text="${ordem.status}"></span></td>
                    <td th:text="${ordem.abertaEm}"></td>
                    <td class="text-end"
                        th:text="|R$ ${#numbers.formatDecimal(ordem.total, 1, 'POINT', 2, 'COMMA')}|"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
