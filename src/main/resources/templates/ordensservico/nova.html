<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabeca('Nova ordem de serviço')}"></head>
<body>
<div class="oficina">
    <nav th:replace="~{fragments/navegacao :: principal('ordens')}"></nav>

    <main class="chao">
        <a th:href="@{/clientes/{clienteId}/veiculos(clienteId=${cliente.id})}" class="voltar">
            ← Voltar para os veículos de <span th:text="${cliente.nome}">cliente</span>
        </a>

        <header class="cabecalho-pagina">
            <div>
                <span class="etiqueta">Entrada no pátio</span>
                <h1 class="estampa estampa--pagina">Nova ordem de serviço</h1>
            </div>
        </header>

        <div class="dupla dupla--conteudo">
            <section class="painel">
                <div class="painel__corpo painel__corpo--largo">
                    <form th:action="@{/ordens-servico}" th:object="${form}" method="post" novalidate>
                        <input type="hidden" th:field="*{veiculoId}">
                        <div class="campos">
                            <div class="campo">
                                <label for="relatoProblema" class="rotulo">
                                    O que o cliente relatou
                                </label>
                                <textarea id="relatoProblema" rows="6" class="entrada"
                                          placeholder="Barulho ao frear em baixa velocidade, começou na semana passada."
                                          th:field="*{relatoProblema}"
                                          th:classappend="${#fields.hasErrors('relatoProblema')} ? 'entrada--recusada'"></textarea>
                                <span class="recusa" th:errors="*{relatoProblema}"></span>
                            </div>
                            <div class="campos__pe">
                                <button type="submit" class="botao botao--acao">
                                    Abrir ordem de serviço
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </section>

            <aside class="painel">
                <div class="painel__corpo ficha-veiculo">
                    <span class="etiqueta">Veículo que entra</span>
                    <span th:replace="~{fragments/componentes :: placaGrande(${veiculo.placa})}"></span>
                    <p class="chamada" th:text="|${veiculo.marca} ${veiculo.modelo}|">Marca Modelo</p>
                    <p class="apoio" th:text="${cliente.nome}">Cliente</p>
                </div>
            </aside>
        </div>
    </main>
</div>
</body>
</html>
