<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova ordem de serviço · Oficina Sampaio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/navegacao :: principal}"></nav>

<main class="container py-4">
    <a th:href="@{/clientes/{clienteId}/veiculos(clienteId=${cliente.id})}" class="link-secondary">
        ← Voltar para veículos
    </a>
    <div class="row justify-content-center mt-3">
        <section class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3">Nova ordem de serviço</h1>
                    <p class="text-body-secondary">
                        <strong th:text="${cliente.nome}"></strong>
                        · <span th:text="|${veiculo.placa} — ${veiculo.marca} ${veiculo.modelo}|"></span>
                    </p>

                    <form th:action="@{/ordens-servico}" th:object="${form}" method="post" novalidate>
                        <input type="hidden" th:field="*{veiculoId}">
                        <div class="mb-3">
                            <label for="relatoProblema" class="form-label">Problema relatado</label>
                            <textarea id="relatoProblema" rows="5" class="form-control"
                                      th:field="*{relatoProblema}"
                                      th:classappend="${#fields.hasErrors('relatoProblema')} ? 'is-invalid'"></textarea>
                            <div class="invalid-feedback" th:errors="*{relatoProblema}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Abrir ordem de serviço</button>
                    </form>
                </div>
            </div>
        </section>
    </div>
</main>
</body>
</html>
