<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ordem de serviço · Oficina Sampaio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/navegacao :: principal}"></nav>

<main class="container py-4">
    <div class="d-flex align-items-start justify-content-between mb-4">
        <div>
            <a th:href="@{/ordens-servico}" class="link-secondary">← Voltar para ordens</a>
            <h1 class="h3 mt-2 mb-1"
                th:text="|Ordem #${#strings.substring(ordem.id.toString(), 0, 8)}|"></h1>
            <p class="text-body-secondary mb-0">
                <strong th:text="${cliente.nome}"></strong>
                · <span th:text="|${veiculo.placa} — ${veiculo.marca} ${veiculo.modelo}|"></span>
            </p>
        </div>
        <span class="badge text-bg-primary fs-6" th:text="${ordem.status}"></span>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5">Problema relatado</h2>
            <p class="mb-0" th:text="${ordem.relatoProblema}"></p>
        </div>
    </div>

    <div class="row g-4">
        <section class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white"><h2 class="h5 mb-0">Serviços e peças</h2></div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Descrição</th>
                            <th class="text-end">Qtd.</th>
                            <th class="text-end">Unitário</th>
                            <th class="text-end">Total</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${ordem.itens.isEmpty()}">
                            <td colspan="5" class="text-center text-body-secondary py-4">
                                Nenhum item incluído.
                            </td>
                        </tr>
                        <tr th:each="item : ${ordem.itens}">
                            <td th:text="${item.tipo == T(br.com.oficinasampaio.ordemservico.application.TipoItemOrdemServicoView).SERVICO ? 'Serviço' : 'Peça'}"></td>
                            <td th:text="${item.descricao}"></td>
                            <td class="text-end" th:text="${item.quantidade}"></td>
                            <td class="text-end"
                                th:text="|R$ ${#numbers.formatDecimal(item.valorUnitario, 1, 'POINT', 2, 'COMMA')}|"></td>
                            <td class="text-end fw-semibold"
                                th:text="|R$ ${#numbers.formatDecimal(item.total, 1, 'POINT', 2, 'COMMA')}|"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card shadow-sm mt-4" th:if="${ordem.status.name() == 'ABERTA'}">
                <div class="card-body">
                    <h2 class="h5 mb-3">Adicionar item</h2>
                    <form th:action="@{/ordens-servico/{id}/itens(id=${ordem.id})}"
                          th:object="${itemForm}" method="post" novalidate>
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label for="tipo" class="form-label">Tipo</label>
                                <select id="tipo" class="form-select" th:field="*{tipo}"
                                        th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'">
                                    <option value="">Selecione</option>
                                    <option value="SERVICO">Serviço</option>
                                    <option value="PECA">Peça</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{tipo}"></div>
                            </div>
                            <div class="col-md-9">
                                <label for="descricao" class="form-label">Descrição</label>
                                <input id="descricao" class="form-control" th:field="*{descricao}"
                                       th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{descricao}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="quantidade" class="form-label">Quantidade</label>
                                <input id="quantidade" type="number" min="0.001" step="0.001"
                                       class="form-control" th:field="*{quantidade}"
                                       th:classappend="${#fields.hasErrors('quantidade')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{quantidade}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="valorUnitario" class="form-label">Valor unitário</label>
                                <input id="valorUnitario" type="number" min="0.01" step="0.01"
                                       class="form-control" th:field="*{valorUnitario}"
                                       th:classappend="${#fields.hasErrors('valorUnitario')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{valorUnitario}"></div>
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button type="submit" class="btn btn-primary w-100">Adicionar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <aside class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5">Totais</h2>
                    <dl class="row mb-0">
                        <dt class="col-7 fw-normal">Serviços</dt>
                        <dd class="col-5 text-end"
                            th:text="|R$ ${#numbers.formatDecimal(ordem.totalServicos, 1, 'POINT', 2, 'COMMA')}|"></dd>
                        <dt class="col-7 fw-normal">Peças</dt>
                        <dd class="col-5 text-end"
                            th:text="|R$ ${#numbers.formatDecimal(ordem.totalPecas, 1, 'POINT', 2, 'COMMA')}|"></dd>
                        <dt class="col-7 border-top pt-2">Total</dt>
                        <dd class="col-5 text-end border-top pt-2 fw-bold"
                            th:text="|R$ ${#numbers.formatDecimal(ordem.total, 1, 'POINT', 2, 'COMMA')}|"></dd>
                    </dl>
                </div>
            </div>
        </aside>
    </div>
</main>
</body>
</html>
