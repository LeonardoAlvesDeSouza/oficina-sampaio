<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabeca(${tituloModulo})}"></head>
<body>
<div class="oficina">
    <nav th:replace="~{fragments/navegacao :: principal(${secao})}"></nav>

    <main class="chao">
        <header class="cabecalho-pagina">
            <div>
                <span class="etiqueta">Área reservada</span>
                <h1 class="estampa estampa--pagina" th:text="${tituloModulo}">Módulo</h1>
            </div>
        </header>

        <section class="obra">
            <!-- Mesma hachura de "aguardando peça": travado, não prossiga -->
            <div class="obra__faixa" aria-hidden="true"></div>

            <div class="painel">
                <div class="painel__corpo painel__corpo--largo">
                    <h2 class="estampa estampa--painel">Módulo em construção</h2>
                    <p class="legenda" th:text="${descricaoModulo}">Descrição</p>

                    <a th:href="@{/ordens-servico}" class="botao botao--acao">
                        Voltar para o quadro de ordens
                    </a>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
