<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabeca('Usuários')}"></head>
<body>
<div class="oficina">
    <nav th:replace="~{fragments/navegacao :: principal('usuarios')}"></nav>

    <main class="chao">
        <header class="cabecalho-pagina">
            <div>
                <span class="etiqueta">Acesso ao sistema</span>
                <h1 class="estampa estampa--pagina">Usuários</h1>
            </div>
            <span class="dado" th:text="|${usuarios.size()} com acesso|">0 com acesso</span>
        </header>

        <div class="dupla">
            <section class="painel">
                <div class="painel__cabeca">
                    <h2 class="estampa estampa--painel">Novo usuário</h2>
                </div>
                <div class="painel__corpo">
                    <form th:action="@{/usuarios}" th:object="${form}" method="post" novalidate>
                        <div class="campos">
                            <div class="campo">
                                <label for="nome" class="rotulo">Nome</label>
                                <input id="nome" class="entrada" th:field="*{nome}"
                                       th:classappend="${#fields.hasErrors('nome')} ? 'entrada--recusada'">
                                <span class="recusa" th:errors="*{nome}"></span>
                            </div>
                            <div class="campo">
                                <label for="login" class="rotulo">Login</label>
                                <input id="login" class="entrada" th:field="*{login}"
                                       autocomplete="off"
                                       th:classappend="${#fields.hasErrors('login')} ? 'entrada--recusada'">
                                <span class="recusa" th:errors="*{login}"></span>
                            </div>
                            <div class="campo">
                                <label for="senha" class="rotulo">Senha inicial</label>
                                <input id="senha" type="password" class="entrada" th:field="*{senha}"
                                       autocomplete="new-password"
                                       th:classappend="${#fields.hasErrors('senha')} ? 'entrada--recusada'">
                                <span class="recusa" th:errors="*{senha}"></span>
                            </div>
                            <div class="campo">
                                <label for="perfil" class="rotulo">Perfil</label>
                                <select id="perfil" class="entrada" th:field="*{perfil}"
                                        th:classappend="${#fields.hasErrors('perfil')} ? 'entrada--recusada'">
                                    <option value="">Selecione</option>
                                    <option th:each="perfil : ${perfis}" th:value="${perfil}"
                                            th:text="${perfil}"></option>
                                </select>
                                <span class="recusa" th:errors="*{perfil}"></span>
                            </div>
                            <div class="campos__pe">
                                <button type="submit" class="botao botao--acao botao--cheio">
                                    Cadastrar usuário
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </section>

            <section>
                <div class="painel painel--rolagem">
                    <table class="tabela">
                        <colgroup>
                            <col>
                            <col class="col--veiculo">
                            <col class="col--medida">
                            <col class="col--total">
                        </colgroup>
                        <thead>
                        <tr>
                            <th scope="col">Nome</th>
                            <th scope="col">Login</th>
                            <th scope="col">Perfil</th>
                            <th scope="col" class="tabela__acoes">Acesso</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${usuarios.isEmpty()}">
                            <td colspan="4" class="tabela__nada">Nenhum usuário cadastrado.</td>
                        </tr>
                        <tr th:each="usuario : ${usuarios}">
                            <td>
                                <span class="chamada" th:text="${usuario.nome}">Nome</span>
                            </td>
                            <td>
                                <span class="dado" th:text="${usuario.login}">login</span>
                            </td>
                            <td>
                                <span class="tipo-item" th:text="${usuario.perfil}">PERFIL</span>
                            </td>
                            <td class="tabela__acoes">
                                <span class="estado"
                                      th:classappend="${usuario.ativo} ? 'estado--ativo' : 'estado--inativo'"
                                      th:text="${usuario.ativo} ? 'Ativo' : 'Inativo'">Ativo</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
