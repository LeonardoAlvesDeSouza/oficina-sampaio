<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Rail fixo. A seção ativa vem por parâmetro: o Thymeleaf 3.1 não expõe mais
     a requisição nos templates, então cada tela declara onde está. -->
<nav th:fragment="principal(secao)" class="rail">
    <a class="rail__marca" th:href="@{/ordens-servico}">
        <span th:replace="~{fragments/componentes :: marca}"></span>
    </a>

    <p class="rail__grupo">Pátio</p>
    <a th:href="@{/clientes}" class="rail__link"
       th:attr="aria-current=${secao == 'clientes' ? 'page' : null}">Clientes</a>
    <a th:href="@{/ordens-servico}" class="rail__link"
       th:attr="aria-current=${secao == 'ordens' ? 'page' : null}">Ordens de serviço</a>

    <p class="rail__grupo">Caixa</p>
    <a th:href="@{/pagamentos}" class="rail__link"
       th:attr="aria-current=${secao == 'pagamentos' ? 'page' : null}">Pagamentos</a>
    <!-- Posição e saídas do caixa são assunto do dono da oficina; a entrada de
         menu segue a mesma regra da rota, para o funcionário não bater em 403. -->
    <a th:if="${administrador}" th:href="@{/financeiro}" class="rail__link"
       th:attr="aria-current=${secao == 'financeiro' ? 'page' : null}">Financeiro</a>

    <p class="rail__grupo">Gestão</p>
    <a th:href="@{/relatorios}" class="rail__link"
       th:attr="aria-current=${secao == 'relatorios' ? 'page' : null}">
        Relatórios <span class="rail__obra">em obra</span>
    </a>
    <a th:if="${administrador}" th:href="@{/usuarios}" class="rail__link"
       th:attr="aria-current=${secao == 'usuarios' ? 'page' : null}">Usuários</a>

    <div class="rail__saida">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="rail__sair">Sair</button>
        </form>
    </div>
</nav>

</body>
</html>
