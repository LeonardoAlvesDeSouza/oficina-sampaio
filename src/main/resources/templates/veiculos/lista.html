<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabeca('Veículos')}"></head>
<body>
<div class="oficina">
    <nav th:replace="~{fragments/navegacao :: principal('clientes')}"></nav>

    <main class="chao">
        <a th:href="@{/clientes}" class="voltar">← Voltar para clientes</a>

        <header class="cabecalho-pagina">
            <div>
                <span class="etiqueta">Veículos de</span>
                <h1 class="estampa estampa--pagina" th:text="${cliente.nome}">Cliente</h1>
            </div>
            <span class="dado"
                  th:text="${veiculos.size() == 1 ? '1 veículo' : veiculos.size() + ' veículos'}">0 veículos</span>
        </header>

        <div class="dupla">
            <section class="painel">
                <div class="painel__cabeca">
                    <h2 class="estampa estampa--painel">Novo veículo</h2>
                </div>
                <div class="painel__corpo">
                    <form th:action="@{/clientes/{id}/veiculos(id=${cliente.id})}"
                          th:object="${form}" method="post" novalidate>
                        <div class="campos">
                            <div class="campo">
                                <label for="placa" class="rotulo">Placa</label>
                                <input id="placa" class="entrada entrada--placa" th:field="*{placa}"
                                       placeholder="ABC1D23" maxlength="8"
                                       th:classappend="${#fields.hasErrors('placa')} ? 'entrada--recusada'">
                                <span class="recusa" th:errors="*{placa}"></span>
                            </div>
                            <div class="campo">
                                <label for="marca" class="rotulo">Marca</label>
                                <input id="marca" class="entrada" th:field="*{marca}"
                                       th:classappend="${#fields.hasErrors('marca')} ? 'entrada--recusada'">
                                <span class="recusa" th:errors="*{marca}"></span>
                            </div>
                            <div class="campo">
                                <label for="modelo" class="rotulo">Modelo</label>
                                <input id="modelo" class="entrada" th:field="*{modelo}"
                                       th:classappend="${#fields.hasErrors('modelo')} ? 'entrada--recusada'">
                                <span class="recusa" th:errors="*{modelo}"></span>
                            </div>
                            <div class="campo campo--meio">
                                <label for="ano" class="rotulo">Ano</label>
                                <input id="ano" type="number" class="entrada" th:field="*{ano}">
                            </div>
                            <div class="campo campo--meio">
                                <label for="cor" class="rotulo">Cor</label>
                                <input id="cor" class="entrada" th:field="*{cor}">
                            </div>
                            <div class="campo">
                                <label for="quilometragem" class="rotulo">Quilometragem</label>
                                <input id="quilometragem" type="number" min="0" class="entrada"
                                       th:field="*{quilometragem}"
                                       th:classappend="${#fields.hasErrors('quilometragem')} ? 'entrada--recusada'">
                                <span class="recusa" th:errors="*{quilometragem}"></span>
                            </div>
                            <div class="campos__pe">
                                <button type="submit" class="botao botao--acao botao--cheio">
                                    Cadastrar veículo
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </section>

            <section>
                <div class="painel painel--rolagem" th:if="${!veiculos.isEmpty()}">
                    <table class="tabela">
                        <colgroup>
                            <col class="col--medida">
                            <col>
                            <col class="col--abertura">
                            <col class="col--total">
                        </colgroup>
                        <thead>
                        <tr>
                            <th scope="col">Placa</th>
                            <th scope="col">Veículo</th>
                            <th scope="col" class="num">Quilometragem</th>
                            <th scope="col" class="tabela__acoes">Ordem</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="veiculo : ${veiculos}">
                            <td>
                                <span th:replace="~{fragments/componentes :: placa(${veiculo.placa})}"></span>
                            </td>
                            <td>
                                <span class="chamada"
                                      th:text="|${veiculo.marca} ${veiculo.modelo}|">Marca Modelo</span>
                                <span class="apoio">
                                    <span th:text="${veiculo.ano} ?: '—'">0000</span>
                                    · <span th:text="${veiculo.cor} ?: '—'">cor</span>
                                </span>
                            </td>
                            <td class="num">
                                <span class="dado" th:if="${veiculo.quilometragem != null}"
                                      th:text="|${#numbers.formatInteger(veiculo.quilometragem, 1, 'POINT')} km|">0 km</span>
                                <span class="vazio" th:unless="${veiculo.quilometragem != null}">—</span>
                            </td>
                            <td class="tabela__acoes">
                                <a class="botao botao--chapa botao--pequeno"
                                   th:href="@{/ordens-servico/nova(veiculoId=${veiculo.id})}">Abrir ordem</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="painel" th:if="${veiculos.isEmpty()}">
                    <div class="painel__corpo painel__corpo--largo nada-aqui">
                        <h2 class="estampa estampa--painel">Nenhum veículo neste cliente</h2>
                        <p class="legenda">
                            Cadastre a placa ao lado para poder abrir uma ordem de serviço.
                        </p>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
