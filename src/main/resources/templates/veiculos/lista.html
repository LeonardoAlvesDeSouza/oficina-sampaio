<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veículos · Oficina Sampaio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<nav th:replace="~{fragments/navegacao :: principal}"></nav>

<main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <a th:href="@{/clientes}" class="link-secondary">← Voltar para clientes</a>
            <h1 class="h3 mt-2 mb-0" th:text="|Veículos de ${cliente.nome}|">Veículos</h1>
        </div>
        <span class="text-body-secondary" th:text="|${veiculos.size()} cadastrado(s)|"></span>
    </div>

    <div class="row g-4">
        <section class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5 mb-3">Novo veículo</h2>
                    <form th:action="@{/clientes/{id}/veiculos(id=${cliente.id})}"
                          th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="placa" class="form-label">Placa</label>
                            <input id="placa" class="form-control text-uppercase" th:field="*{placa}"
                                   th:classappend="${#fields.hasErrors('placa')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{placa}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="marca" class="form-label">Marca</label>
                            <input id="marca" class="form-control" th:field="*{marca}"
                                   th:classappend="${#fields.hasErrors('marca')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{marca}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="modelo" class="form-label">Modelo</label>
                            <input id="modelo" class="form-control" th:field="*{modelo}"
                                   th:classappend="${#fields.hasErrors('modelo')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{modelo}"></div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label for="ano" class="form-label">Ano</label>
                                <input id="ano" type="number" class="form-control" th:field="*{ano}">
                            </div>
                            <div class="col-6">
                                <label for="cor" class="form-label">Cor</label>
                                <input id="cor" class="form-control" th:field="*{cor}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="quilometragem" class="form-label">Quilometragem</label>
                            <input id="quilometragem" type="number" min="0" class="form-control"
                                   th:field="*{quilometragem}"
                                   th:classappend="${#fields.hasErrors('quilometragem')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{quilometragem}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Cadastrar veículo</button>
                    </form>
                </div>
            </div>
        </section>

        <section class="col-lg-8">
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Placa</th>
                            <th>Veículo</th>
                            <th>Ano</th>
                            <th>Cor</th>
                            <th class="text-end">Quilometragem</th>
                            <th class="text-end">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${veiculos.isEmpty()}">
                            <td colspan="6" class="text-center text-body-secondary py-4">
                                Nenhum veículo cadastrado para este cliente.
                            </td>
                        </tr>
                        <tr th:each="veiculo : ${veiculos}">
                            <td><strong th:text="${veiculo.placa}"></strong></td>
                            <td th:text="|${veiculo.marca} ${veiculo.modelo}|"></td>
                            <td th:text="${veiculo.ano ?: '—'}"></td>
                            <td th:text="${veiculo.cor ?: '—'}"></td>
                            <td class="text-end" th:text="${veiculo.quilometragem ?: '—'}"></td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/ordens-servico/nova(veiculoId=${veiculo.id})}">Abrir OS</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>
</body>
</html>
