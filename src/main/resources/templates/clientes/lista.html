<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabeca('Clientes')}"></head>
<body>
<div class="oficina">
    <nav th:replace="~{fragments/navegacao :: principal('clientes')}"></nav>

    <main class="chao">
        <header class="cabecalho-pagina">
            <div>
                <span class="etiqueta">Cadastro</span>
                <h1 class="estampa estampa--pagina">Clientes</h1>
            </div>
            <span class="dado" th:text="|${clientes.size()} no cadastro|">0 no cadastro</span>
        </header>

        <div class="dupla">
            <section class="painel">
                <div class="painel__cabeca">
                    <h2 class="estampa estampa--painel">Novo cliente</h2>
                </div>
                <div class="painel__corpo">
                    <form th:action="@{/clientes}" th:object="${form}" method="post" novalidate>
                        <div class="campos">
                            <div class="campo">
                                <label for="nome" class="rotulo">Nome</label>
                                <input id="nome" class="entrada" th:field="*{nome}"
                                       th:classappend="${#fields.hasErrors('nome')} ? 'entrada--recusada'">
                                <span class="recusa" th:errors="*{nome}"></span>
                            </div>
                            <div class="campo">
                                <label for="cpfCnpj" class="rotulo">CPF ou CNPJ</label>
                                <input id="cpfCnpj" class="entrada" th:field="*{cpfCnpj}"
                                       th:classappend="${#fields.hasErrors('cpfCnpj')} ? 'entrada--recusada'">
                                <span class="recusa" th:errors="*{cpfCnpj}"></span>
                            </div>
                            <div class="campo">
                                <label for="telefone" class="rotulo">Telefone</label>
                                <input id="telefone" class="entrada" th:field="*{telefone}">
                            </div>
                            <div class="campo">
                                <label for="email" class="rotulo">E-mail</label>
                                <input id="email" type="email" class="entrada" th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'entrada--recusada'">
                                <span class="recusa" th:errors="*{email}"></span>
                            </div>
                            <div class="campos__pe">
                                <button type="submit" class="botao botao--acao botao--cheio">
                                    Cadastrar cliente
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </section>

            <section>
                <!-- A linha inteira reage porque o nome abre os veículos do
                     cliente; o botão é o mesmo caminho, dito por escrito. -->
                <div class="painel painel--rolagem" th:if="${!clientes.isEmpty()}">
                    <table class="tabela tabela--clicavel">
                        <colgroup>
                            <col>
                            <col class="col--abertura">
                            <col class="col--veiculo">
                            <col class="col--total">
                        </colgroup>
                        <thead>
                        <tr>
                            <th scope="col">Nome</th>
                            <th scope="col">CPF/CNPJ</th>
                            <th scope="col">Contato</th>
                            <th scope="col" class="tabela__acoes">Veículos</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cliente : ${clientes}">
                            <td>
                                <a class="chamada"
                                   th:href="@{/clientes/{id}/veiculos(id=${cliente.id})}"
                                   th:text="${cliente.nome}">Nome</a>
                            </td>
                            <td>
                                <span class="dado" th:if="${cliente.documento}"
                                      th:text="${cliente.documento}">000.000.000-00</span>
                                <span class="vazio" th:unless="${cliente.documento}">—</span>
                            </td>
                            <td>
                                <span class="dado" th:if="${cliente.telefone}"
                                      th:text="${cliente.telefone}">(00) 00000-0000</span>
                                <span class="apoio" th:if="${cliente.email}"
                                      th:text="${cliente.email}">E-mail</span>
                                <span class="vazio" th:if="${cliente.semContato()}">—</span>
                            </td>
                            <td class="tabela__acoes">
                                <a class="botao botao--chapa botao--pequeno"
                                   th:href="@{/clientes/{id}/veiculos(id=${cliente.id})}">Ver veículos</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="painel" th:if="${clientes.isEmpty()}">
                    <div class="painel__corpo painel__corpo--largo nada-aqui">
                        <h2 class="estampa estampa--painel">Cadastro vazio</h2>
                        <p class="legenda">
                            Cadastre o primeiro cliente no formulário ao lado. Depois dele vêm os
                            veículos, e do veículo sai a ordem de serviço.
                        </p>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
