<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes · Oficina Sampaio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Oficina Sampaio</a>
    </div>
</nav>

<main class="container py-4">
    <div class="row g-4">
        <section class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4 mb-3">Novo cliente</h1>
                    <form th:action="@{/clientes}" th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input id="nome" class="form-control" th:field="*{nome}"
                                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{nome}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="cpfCnpj" class="form-label">CPF/CNPJ</label>
                            <input id="cpfCnpj" class="form-control" th:field="*{cpfCnpj}"
                                   th:classappend="${#fields.hasErrors('cpfCnpj')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{cpfCnpj}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input id="telefone" class="form-control" th:field="*{telefone}">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input id="email" type="email" class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Cadastrar cliente</button>
                    </form>
                </div>
            </div>
        </section>

        <section class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 mb-0">Clientes</h2>
                <span class="text-body-secondary" th:text="|${clientes.size()} cadastrado(s)|"></span>
            </div>

            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Nome</th>
                            <th>CPF/CNPJ</th>
                            <th>Telefone</th>
                            <th>E-mail</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${clientes.isEmpty()}">
                            <td colspan="5" class="text-center text-body-secondary py-4">
                                Nenhum cliente cadastrado.
                            </td>
                        </tr>
                        <tr th:each="cliente : ${clientes}">
                            <td th:text="${cliente.nome}"></td>
                            <td th:text="${cliente.cpfCnpj ?: '—'}"></td>
                            <td th:text="${cliente.telefone ?: '—'}"></td>
                            <td th:text="${cliente.email ?: '—'}"></td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/clientes/{id}/veiculos(id=${cliente.id})}">Veículos</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>
</body>
</html>
