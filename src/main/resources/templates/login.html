<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabeca('Entrar')}"></head>
<body>
<main class="portaria">
    <div class="portaria__cartao">
        <div class="portaria__marca">
            <span th:replace="~{fragments/componentes :: marcaGrande}"></span>
        </div>

        <div class="portaria__folha">
            <header class="portaria__abertura">
                <h1 class="estampa estampa--painel">Entrar</h1>
                <p class="legenda">Use o login cadastrado pela oficina.</p>
            </header>

            <div th:if="${param.erro}" class="recado recado--falha" role="alert">
                Login e senha não conferem.
            </div>
            <div th:if="${param.logout}" class="recado recado--feito" role="status">
                Você saiu do sistema.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="campos">
                    <div class="campo">
                        <label for="username" class="rotulo">Login</label>
                        <input id="username" name="username" class="entrada"
                               autocomplete="username" required autofocus>
                    </div>
                    <div class="campo">
                        <label for="password" class="rotulo">Senha</label>
                        <input id="password" name="password" type="password" class="entrada"
                               autocomplete="current-password" required>
                    </div>
                    <div class="campos__pe">
                        <button type="submit" class="botao botao--acao botao--cheio">Entrar</button>
                    </div>
                </div>
            </form>
        </div>

        <p class="portaria__rodape">Sistema interno da oficina</p>
    </div>
</main>
</body>
</html>
