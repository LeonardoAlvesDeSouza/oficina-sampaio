<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Oficina Sampaio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card shadow-sm" style="max-width: 26rem; width: 100%">
        <div class="card-body p-4">
            <h1 class="h3 mb-1">Oficina Sampaio</h1>
            <p class="text-body-secondary mb-4">Entre para acessar a gestão da oficina.</p>

            <div th:if="${param.erro}" class="alert alert-danger" role="alert">
                Login ou senha inválidos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                Sessão encerrada.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Login</label>
                    <input id="username" name="username" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input id="password" name="password" type="password" class="form-control"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
