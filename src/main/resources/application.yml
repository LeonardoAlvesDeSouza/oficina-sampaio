spring:
  application:
    name: oficina-sampaio
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina_sampaio}
    username: ${DB_USERNAME:oficina}
    password: ${DB_PASSWORD:oficina}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    cache: false
